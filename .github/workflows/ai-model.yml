name: Prepare ToollooT GitHub AI model
on:
  push:
    branches: [main]
    paths: [".github/workflows/ai-model.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download open model assets
        run: |
          set -euo pipefail
          mkdir -p model
          base="https://huggingface.co/onnx-community/Qwen3-0.6B-ONNX/resolve/main"
          for f in config.json generation_config.json chat_template.jinja special_tokens_map.json tokenizer.json tokenizer_config.json; do
            curl -L --fail --retry 3 --retry-delay 2 -o "model/$f" "$base/$f"
          done
          curl -L --fail --retry 3 --retry-delay 2 -o model/model_q4f16.onnx "$base/onnx/model_q4f16.onnx"
          curl -L --fail --retry 3 --retry-delay 2 -o model/model_q4.onnx "$base/onnx/model_q4.onnx"
      - name: Publish model assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          release_id="$(gh api "repos/$repo/releases/tags/toolloot-ai-v1" --jq .id 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            gh release create toolloot-ai-v1 --repo "$repo" --target "${{ github.sha }}" --title "ToollooT AI Model v1" --notes "Qwen3 0.6B ONNX assets for ToollooT browser inference." --latest
            for _ in $(seq 1 20); do
              release_id="$(gh api "repos/$repo/releases/tags/toolloot-ai-v1" --jq .id 2>/dev/null || true)"
              [ -n "$release_id" ] && break
              sleep 2
            done
          fi
          test -n "$release_id"
          for file in model/*; do
            name="$(basename "$file")"
            curl -L --fail --retry 3 --retry-delay 2               -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "Content-Type: application/octet-stream"               --data-binary @"$file"               "https://uploads.github.com/repos/$repo/releases/$release_id/assets?name=$name"
          done
