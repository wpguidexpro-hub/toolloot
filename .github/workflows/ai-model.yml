name: Prepare ToollooT GitHub AI model
on:
  push:
    branches: [main]
    paths: [".github/workflows/ai-model.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download q4 model and split for GitHub Raw
        run: |
          set -euo pipefail
          rm -rf models/github-ai/q4
          mkdir -p models/github-ai/q4
          base="https://huggingface.co/onnx-community/Qwen3-0.6B-ONNX/resolve/main"
          for f in config.json generation_config.json chat_template.jinja special_tokens_map.json tokenizer.json tokenizer_config.json; do
            curl -L --fail --retry 3 --retry-delay 2 -o "models/github-ai/q4/$f" "$base/$f"
          done
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/model_q4.onnx "$base/onnx/model_q4.onnx"
          split -b 60M -d -a 3 /tmp/model_q4.onnx models/github-ai/q4/model_q4.part-
          count=$(find models/github-ai/q4 -name 'model_q4.part-*' | wc -l)
          test "$count" -ge 15
          printf '{"parts":%s}\n' "$count" > models/github-ai/q4/model_q4.manifest.json
      - name: Commit model chunks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/github-ai/q4/config.json models/github-ai/q4/generation_config.json models/github-ai/q4/chat_template.jinja models/github-ai/q4/special_tokens_map.json models/github-ai/q4/tokenizer.json models/github-ai/q4/tokenizer_config.json models/github-ai/q4/model_q4.manifest.json
          git commit -m "add GitHub AI q4 metadata"
          git pull --rebase origin main
          git push origin main
          for part in models/github-ai/q4/model_q4.part-*; do
            git add "$part"
            git commit -m "add GitHub AI q4 model chunk $(basename "$part")"
            git pull --rebase origin main
            git push origin main
          done

# q4 chunked GitHub Raw delivery
