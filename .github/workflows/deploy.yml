name: Deploy ToolLoot to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Prepare route pages
        run: |
          for route in about categories privacy terms contact how-to-use how-to-use/image-compressor tools/image-compressor tools/image-resizer tools/image-converter tools/jpg-to-png tools/jpg-to-webp tools/webp-to-jpg tools/heic-to-jpg tools/image-cropper tools/background-remover tools/compress-to-size how-to-use/image-resizer how-to-use/image-converter how-to-use/jpg-to-png how-to-use/jpg-to-webp how-to-use/webp-to-jpg how-to-use/heic-to-jpg how-to-use/image-cropper how-to-use/background-remover how-to-use/compress-to-size; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
